name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run domain and storage tests
        run: node --test src/domain/subscription.test.js src/storage/subscriptionStorage.test.js src/theme.test.js
      - name: Lint
        run: npx expo lint
